services:
  database:
    image: postgres:16-alpine
    container_name: talentflow_postgres
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: app
      POSTGRES_PASSWORD: admir
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentflow_backend
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/var # isolation du dossier cache pour éviter les problèmes de permissions
    environment:
      DATABASE_URL: "postgresql://app:admir@database:5432/talentflow?serverVersion=16&charset=utf8"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentflow_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pg_data:
